<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="238" viewBox="0 0 1000 238" role="img" aria-labelledby="title desc">
  <title id="title">TraceLens data flow</title><desc id="desc">A local log file is parsed in the browser, normalized, filtered and correlated, then shown in the incident workspace. No logs are sent to a server.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#131f27"/><stop offset="1" stop-color="#0b1119"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#3bbf9f"/><stop offset="1" stop-color="#86e6ce"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1000" height="238" rx="18" fill="url(#bg)" stroke="#293a43"/>
  <text x="36" y="38" fill="#85a9a0" font-family="ui-monospace,monospace" font-size="10" letter-spacing="2">ONE FILE. ONE BROWSER. YOUR LOGS STAY YOURS.</text>
  <g font-family="ui-sans-serif,system-ui,sans-serif">
    <rect x="36" y="72" width="190" height="112" rx="12" fill="#111b25" stroke="#2b3b46"/><path d="M63 101h15l9 9v31H63z" fill="none" stroke="#7ea99e" stroke-width="2"/><path d="M78 101v10h9M68 120h13m-13 7h13" fill="none" stroke="#7ea99e" stroke-width="2" stroke-linecap="round"/><text x="104" y="119" fill="#e1ebed" font-size="13" font-weight="600">Local log file</text><text x="104" y="140" fill="#80909d" font-size="10">JSONL · NDJSON · text</text><text x="104" y="157" fill="#5eb9a7" font-size="9" font-family="ui-monospace,monospace">up to 20 MB</text>
    <path d="M241 128h61" stroke="url(#accent)" stroke-width="2"/><path d="m296 122 8 6-8 6" fill="none" stroke="#7ce0c7" stroke-width="2"/>
    <rect x="318" y="72" width="190" height="112" rx="12" fill="#111b25" stroke="#2b3b46"/><circle cx="355" cy="128" r="23" fill="none" stroke="#3d5c56"/><path d="M355 107v42m-21-21h42" stroke="#72d9c0" stroke-width="1.5"/><circle cx="355" cy="128" r="4" fill="#72d9c0" filter="url(#glow)"/><text x="390" y="119" fill="#e1ebed" font-size="13" font-weight="600">Normalize</text><text x="390" y="140" fill="#80909d" font-size="10">time · level · service</text><text x="390" y="157" fill="#80909d" font-size="10">trace · duration</text>
    <path d="M523 128h61" stroke="url(#accent)" stroke-width="2"/><path d="m578 122 8 6-8 6" fill="none" stroke="#7ce0c7" stroke-width="2"/>
    <rect x="600" y="72" width="178" height="112" rx="12" fill="#111b25" stroke="#2b3b46"/><path d="M624 144V118m11 26V103m11 41v-17m11 17V96m11 48v-30" stroke="#5ad3b7" stroke-width="5" stroke-linecap="round"/><text x="690" y="119" fill="#e1ebed" font-size="13" font-weight="600">Correlate</text><text x="690" y="140" fill="#80909d" font-size="10">filter + trace groups</text><text x="690" y="157" fill="#80909d" font-size="10">metrics + timeline</text>
    <path d="M793 128h61" stroke="url(#accent)" stroke-width="2"/><path d="m848 122 8 6-8 6" fill="none" stroke="#7ce0c7" stroke-width="2"/>
    <rect x="872" y="72" width="91" height="112" rx="12" fill="#172d2d" stroke="#376358"/><path d="M893 104h49M893 117h40M893 130h46M893 143h30" stroke="#75cbbb" stroke-width="2" stroke-linecap="round"/><text x="917" y="164" text-anchor="middle" fill="#d7efea" font-size="10" font-weight="600">Workspace</text>
  </g>
  <path d="M129 205h742" stroke="#273640" stroke-dasharray="3 7"/><circle cx="500" cy="205" r="3" fill="#58cbb2"/><text x="500" y="223" text-anchor="middle" fill="#70928a" font-family="ui-monospace,monospace" font-size="9" letter-spacing="1.4">ALL PROCESSING HAPPENS IN YOUR BROWSER TAB</text>
</svg>
